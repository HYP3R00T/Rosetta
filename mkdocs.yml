site_name: Rosetta
docs_dir: notes
repo_url: https://github.com/HYP3R00T/Rosetta
repo_name: HYP3R00T/Rosetta
theme:
  icon:
    logo: octicons/terminal-24
    menu: material/dots-grid
    search: octicons/search-24
  name: "material"
  theme:
  palette:
  - scheme: default
    accent: deep purple
    primary: deep purple
    toggle:
      icon: material/toggle-switch
      name: Join the dark side. We have cookies.
  - scheme: slate
    accent: deep purple
    primary: deep purple
    toggle:
      icon: material/toggle-switch-off-outline
      name: Prepare for Flashbang!
  font:
    text: Inter
    code: Source Code Pro
  features:
  - navigation.instant
  - navigation.instant.progress
  - navigation.tracking
  - navigation.tabs
  - navigation.path
  - navigation.indexes
  - navigation.top
  - navigation.prune
  - navigation.indexes
  - toc.follow
  - content.code.copy
  - search.share
  - search.suggest
plugins:
- search
- roamlinks
- callouts
- tags
- open-in-new-tab
markdown_extensions:
- footnotes
- nl2br
- admonition
- pymdownx.details
- pymdownx.superfences
- attr_list
- pymdownx.arithmatex:
    generic: true
- pymdownx.tasklist:
    custom_checkbox: true
- def_list
- pymdownx.critic
- pymdownx.caret
- pymdownx.keys
- pymdownx.mark
- pymdownx.tilde
- toc:
    permalink: true
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ""
extra_javascript:
- https://polyfill.io/v3/polyfill.min.js?features=es6
- https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
- https://unpkg.com/mermaid/dist/mermaid.min.js
extra:
  generator: false
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/HYP3R00T
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/rajesh-kumar-das/
  - icon: fontawesome/brands/mastodon
    link: https://mastodon.social/@hyp3r00t
  - icon: fontawesome/brands/x-twitter
    link: https://twitter.com/HYP3R00T
copyright: Copyright &copy; 2024 hyperoot.dev
